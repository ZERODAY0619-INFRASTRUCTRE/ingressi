name: Custom app checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sh scripts/test-custom.sh
      - run: bun run typecheck
      - run: bun run build
        env:
          DATABASE_URL: 'file:/tmp/cpm-ci.db'
          DATABASE_PATH: /tmp/cpm-ci.db
          NEXT_TELEMETRY_DISABLED: '1'
